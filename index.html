<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrenchAssistant - Your On-Chain Analysis Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="/assets/cropped_image.png" type="image/png">
  <link rel="stylesheet" href="styles/colors.css">
  <link rel="stylesheet" href="styles/color-logic.css">
  <link rel="stylesheet" href="styles/custom.css">
</head>

<body class="bg-page-primary text-content-primary">

  <div id="navbar-container"></div>

  <main>
    <div id="hero-container">
      <div id="hero-content"></div>
    </div>

    <div id="recent-session-container"></div>

    <div id="features-container"></div>

    <div id="how-it-works-container">
      <div id="how-it-works"></div>
    </div>

    <div id="limitations-container">
      <div id="limitations"></div>
    </div>

    <div id="roadmap-container">
      <div id="roadmap"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="scripts/main.js" type="module" defer></script>
  <script>
    console.log('[index.html] HTML parser reached right before session.js script tag.');
  </script>
  <script src="scripts/session.js" type="module" defer></script>

  <!-- Smooth anchor scroll after component loading -->
  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        const hash = window.location.hash;
        if (hash) {
          const target = document.querySelector(hash);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }
      }, 200); // Adjust this if your component load is slower/faster
    });
  </script>

</body>
</html>
